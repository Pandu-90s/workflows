name: nodejs eks feature

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string

      component:
        required: true
        type: string

env:
  project: "${{ inputs.project }}"
  component: "${{ inputs.component }}"

jobs:
  build-nodejs:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v7

      - name: list files
        run: |
          ls -l

      - name: read version
        id: version
        run: | 
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPU
      
      - name: print version 
        run: echo "The version is ${{ steps.version.outputs.version }}"